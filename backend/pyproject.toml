[project]
name = "study-planner-backend"
version = "0.1.0"
description = "Study planner backend API"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "pypdf>=6.1.1",
  "pytesseract>=0.3.13",
  "pillow>=12.0.0",
  "sqlalchemy>=2.0.40",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "greenlet>=3.2.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lms_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
