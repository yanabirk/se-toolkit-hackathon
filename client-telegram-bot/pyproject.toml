[project]
name = "client-telegram-bot"
version = "0.1.0"
description = "Telegram bot for study planner"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]
